<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Check Stock</title>
</head>
<body>

  <!-- Toast de Notificaciones -->
  <div id="toast-notification" class="toast hidden"></div>

  <!-- App Container (Full Viewport) -->
  <main class="app-container">
    
    <!-- 1. DASHBOARD -->
    <section class="view active" id="vista-dashboard">
      <header class="app-header">
        <h2>Dashboard</h2>
      </header>

      <div class="stats-container">
        <div class="stat-card">
          <span class="stat-icon">📋</span>
          <h3 id="dash-total-movs">0</h3>
          <p>Movimientos</p>
        </div>
        <div class="stat-card">
          <span class="stat-icon">📦</span>
          <h3 id="dash-total-stock">0</h3>
          <p>Stock Total</p>
        </div>
      </div>

      <div class="section-title">Acceso Rápido</div>
      <div class="quick-access">
        <button class="quick-btn" id="btn-quick-entrada"><span>📈</span><small>Entradas</small></button>
        <button class="quick-btn" id="btn-quick-salida"><span>📉</span><small>Salidas</small></button>
        <button class="quick-btn" id="btn-quick-inv"><span>📦</span><small>Inventario</small></button>
        <button class="quick-btn" id="btn-quick-rep"><span>📊</span><small>Reportes</small></button>
      </div>

      <div class="section-title">Alertas Recientes (<span id="alert-count">0</span>)</div>
      <div id="alerts-list-container"></div>
    </section>

    <!-- 2. INVENTARIO -->
    <section class="view" id="vista-inventario">
      <header class="app-header header-actions">
        <h2>Inventario</h2>
        <button class="btn-primary-sm" id="btn-toggle-new-product">+ Nuevo</button>
      </header>

      <!-- Formulario Desplegable para Nuevo Producto -->
      <form id="form-nuevo-producto" class="card-form hidden">
        <h4>Registrar Nuevo Producto</h4>
        <input type="text" id="new-prod-name" placeholder="Nombre del Producto" required>
        <div class="form-row">
          <input type="text" id="new-prod-sku" placeholder="SKU / Código" required>
          <input type="number" id="new-prod-stock" min="0" placeholder="Stock Inicial" required>
        </div>
        <input type="text" id="new-prod-loc" placeholder="Ubicación (Ej. Bodega A1)" required>
        <div class="form-actions">
          <button type="submit" class="btn-primary full-btn">Guardar Producto</button>
          <button type="button" class="btn-secondary full-btn" id="btn-cancel-product">Cancelar</button>
        </div>
      </form>

      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Buscar por nombre o SKU...">
      </div>

      <div class="filter-pills" id="filter-pills">
        <button class="pill active" data-filter="all">Total</button>
        <button class="pill" data-filter="disponible">Disponible</button>
        <button class="pill" data-filter="agotado">Agotado</button>
      </div>

      <div class="product-cards-list" id="inventory-cards-container"></div>
    </section>

    <!-- 3. NUEVO MOVIMIENTO -->
    <section class="view" id="vista-movimiento">
      <header class="app-header">
        <h2>Nuevo Movimiento</h2>
      </header>

      <form id="form-movimiento" class="mov-form">
        <div class="form-group">
          <label for="mov-producto-select">Seleccionar Producto</label>
          <select id="mov-producto-select" required></select>
        </div>

        <div class="section-title">Tipo De Movimiento</div>
        <div class="mov-type-grid" id="mov-type-selector">
          <button type="button" class="pill-type active" data-type="ENTRADA">+ ENTRADA</button>
          <button type="button" class="pill-type" data-type="SALIDA">- SALIDA</button>
        </div>

        <div class="form-group">
          <label for="mov-cantidad">Cantidad</label>
          <input type="number" id="mov-cantidad" min="1" value="1" required>
        </div>

        <div class="form-group">
          <label for="mov-nota">Motivo / Nota</label>
          <textarea id="mov-nota" rows="3" placeholder="Ej. Recepción de lote o reubicación..." required></textarea>
        </div>

        <button type="submit" class="btn-primary full-btn">GUARDAR MOVIMIENTO</button>
      </form>
    </section>

    <!-- 4. REPORTES -->
    <section class="view" id="vista-reportes">
      <header class="app-header">
        <h2>Reportes e Historial</h2>
      </header>

      <div class="section-title">Historial de Movimientos</div>
      <div id="movements-history-container" class="history-list"></div>
    </section>

  </main>

  <!-- Navigation Bar -->
  <nav class="bottom-navbar">
    <button class="nav-icon-btn active" data-target="vista-dashboard" aria-label="Dashboard">🏠</button>
    <button class="nav-icon-btn" data-target="vista-inventario" aria-label="Inventario">📦</button>
    <button class="nav-icon-btn" data-target="vista-movimiento" aria-label="Movimientos">📋</button>
    <button class="nav-icon-btn" data-target="vista-reportes" aria-label="Reportes">📊</button>
  </nav>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
